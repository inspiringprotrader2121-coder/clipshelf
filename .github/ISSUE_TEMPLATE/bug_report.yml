name: Bug report
description: Something in ClipShelf misbehaved
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.13.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you copy, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of `clipshelf --list`
      render: shell